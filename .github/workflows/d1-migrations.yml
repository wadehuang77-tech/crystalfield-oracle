name: Apply D1 Migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type APPLY to run remote production D1 migrations
        required: true
      database:
        description: Use DB for customer migrations or DB_CARDS to load English card translations
        required: true
        default: DB

jobs:
  migrate:
    name: Apply remote migrations
    if: inputs.confirm == 'APPLY'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Stage customer migrations for Wrangler
        if: inputs.database == 'DB'
        run: |
          rm -rf migrations
          mkdir -p migrations
          cp ../d1/migrations/*.sql migrations/
          ls -la migrations
      - name: Apply customer database migrations
        if: inputs.database == 'DB'
        run: npx wrangler d1 migrations apply "${{ inputs.database }}" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Create cards localization tables
        if: inputs.database == 'DB_CARDS'
        run: npx wrangler d1 execute bolt-tarot-cards --remote --file=../d1/cards-migrations/001_card_localizations.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Import English card translations
        if: inputs.database == 'DB_CARDS'
        run: npx wrangler d1 execute bolt-tarot-cards --remote --file=../d1/cards-localizations-seed.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
