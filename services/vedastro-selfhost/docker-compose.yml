services:
  vedastro-selfhost:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_URLS: http://0.0.0.0:8080
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
